services:
  server-bridge:
    build: .
    container_name: server-bridge
    ports:
      # 로컬 전용 — 인증 없는 배포·파일·도커 API라 인터넷에 열리면 서버 전체가 넘어간다.
      # 원격 접속: ssh -N -L 5500:127.0.0.1:5500 xsandox@112.168.76.70 → http://localhost:5500
      - "127.0.0.1:5500:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/xsandox:/home/xsandox
      - server-bridge-data:/data
    environment:
      - NODE_ENV=production
      - WORKSPACE_ROOT=/home/xsandox
      - DATA_DIR=/data
      - MINIPC_HOST=112.168.76.70
      # 멀티 네트워크 시 Next standalone이 컨테이너 hostname(특정 IP)에만 바인딩되는 문제 방지
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ai-cluster
      - main
    restart: unless-stopped

volumes:
  server-bridge-data:

networks:
  ai-cluster:
    external: true
    name: ai-cluster_default
  main:
    external: true
    name: main_default
